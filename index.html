<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>まちがいさがし Ver.1</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root { --gap: 14px; --radius: 18px; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7; color: #111;
    }
    header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(255,255,255,.92); backdrop-filter: blur(10px);
      padding: 12px 16px; border-bottom: 1px solid #ddd;
    }
    header h1 { margin: 0; font-size: 20px; }
    main { max-width: 920px; margin: 0 auto; padding: 16px; }
    .card {
      background: white; border-radius: var(--radius); padding: 16px;
      margin-bottom: 14px; box-shadow: 0 1px 8px rgba(0,0,0,.06);
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    label { font-weight: 700; font-size: 14px; }
    select, button, input[type=file] {
      font: inherit;
    }
    select, button {
      border: 1px solid #bbb; border-radius: 12px; background: white;
      min-height: 44px; padding: 8px 12px;
    }
    button.primary { background: #111; color: white; border-color: #111; }
    button:disabled { opacity: .45; }
    .status {
      display: flex; justify-content: space-between; gap: 8px;
      font-weight: 700; margin: 8px 0 12px;
    }
    .board {
      display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap);
    }
    .picture {
      position: relative; width: 100%; aspect-ratio: 4 / 3;
      overflow: hidden; border-radius: 14px; background: #eee; touch-action: manipulation;
      border: 2px solid #eee;
    }
    .picture svg, .picture img {
      width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none;
    }
    .hit-ring {
      position: absolute; border: 4px solid #ff3b30; border-radius: 50%;
      transform: translate(-50%, -50%); pointer-events: none;
      box-shadow: 0 0 0 2px rgba(255,255,255,.9);
    }
    .hint-ring {
      position: absolute; border: 5px solid #ffcc00; border-radius: 50%;
      transform: translate(-50%, -50%); pointer-events: none;
      animation: pulse .65s ease-in-out 3;
    }
    .miss-mark {
      position: absolute; transform: translate(-50%, -50%);
      pointer-events: none; font-size: 30px; font-weight: 900;
      line-height: 1; animation: miss .55s ease-out forwards;
    }
    @keyframes miss {
      from { opacity: 1; transform: translate(-50%, -50%) scale(.7); }
      to { opacity: 0; transform: translate(-50%, -50%) scale(1.35); }
    }
    @keyframes pulse { 50% { transform: translate(-50%, -50%) scale(1.3); opacity: .25; } }
    .photo-preview { max-width: 220px; width: 100%; border-radius: 12px; display:none; margin-top:10px; }
    .note { color:#666; font-size:13px; line-height:1.55; }
    .clear {
      display:none; text-align:center; font-size:28px; font-weight:800; padding:18px 6px;
    }
    @media (max-width: 700px) {
      .board { grid-template-columns: 1fr; }
      main { padding: 12px; }
    }
  </style>
</head>
<body>
<header><h1>まちがいさがし Ver.1 <span style="font-size:12px;color:#777;font-weight:600;">build 3.0</span></h1></header>

<main>
  <section class="card">
    <div class="row">
      <label>間違い数
        <select id="countSelect">
          <option value="3">3個</option>
          <option value="5" selected>5個</option>
          <option value="7">7個</option>
          <option value="10">10個</option>
        </select>
      </label>

      <label>難易度
        <select id="difficulty">
          <option value="easy">やさしい</option>
          <option value="normal" selected>ふつう</option>
          <option value="hard">むずかしい</option>
        </select>
      </label>

      <button class="primary" id="startBtn">デモで遊ぶ</button>
      <button id="hintBtn" disabled>ヒント</button>
      <button id="resetBtn" disabled>やり直す</button>
    </div>
    <p class="note">
      現在はAPIなしのゲーム部分を確認するデモ版です。間違い数は3 / 5 / 7 / 10個から選べます。
      難易度は将来AI生成に渡す設定として保存してあり、デモでは当たり判定の大きさが少し変わります。赤丸は間違い部分に合わせて小さく表示します。
    </p>
  </section>

  <section class="card">
    <label>スマホのアルバムから写真を選ぶ（AI変換はまだ行いません）</label>
    <input id="photoInput" type="file" accept="image/*" />
    <img id="photoPreview" class="photo-preview" alt="選択した写真のプレビュー" />
    <p class="note">ここで選んだ写真を、次の段階で「イラスト生成API」に渡す予定です。今は端末内でプレビューするだけなので外部送信しません。</p>
  </section>

  <section class="card" id="gameCard">
    <div class="status">
      <span id="progress">見つけた数：0 / 5</span>
      <span id="message">「デモで遊ぶ」を押してください</span>
    </div>

    <div class="board" id="board">
      <div>
        <div class="picture" id="leftPicture"></div>
        <div class="note" style="text-align:center;margin-top:5px;">もとのイラスト</div>
      </div>
      <div>
        <div class="picture" id="rightPicture"></div>
        <div class="note" style="text-align:center;margin-top:5px;">まちがいのあるイラスト</div>
      </div>
    </div>

    <div id="clearMessage" class="clear">🎉 クリア！全部見つけました！</div>
  </section>
</main>

<script>
const APP_VERSION = "3.0";
const leftPicture = document.getElementById("leftPicture");
const rightPicture = document.getElementById("rightPicture");
const countSelect = document.getElementById("countSelect");
const difficulty = document.getElementById("difficulty");
const startBtn = document.getElementById("startBtn");
const hintBtn = document.getElementById("hintBtn");
const resetBtn = document.getElementById("resetBtn");
const progress = document.getElementById("progress");
const message = document.getElementById("message");
const clearMessage = document.getElementById("clearMessage");
const photoInput = document.getElementById("photoInput");
const photoPreview = document.getElementById("photoPreview");

let activeSpots = [];
let found = new Set();
let gameActive = false;

// 座標は画像幅/高さに対する0〜1の比率。
// 将来AI側からこの形式で受け取れば、そのままゲーム判定に使えます。
const allSpots = [
  // x/y = 中心座標、hitR = タップ判定、ringR = 表示する赤丸の大きさ
  {x:.20,y:.33,hitR:.095,ringR:.055},
  {x:.50,y:.29,hitR:.085,ringR:.043},
  {x:.80,y:.33,hitR:.095,ringR:.060},
  {x:.20,y:.68,hitR:.095,ringR:.055},
  {x:.49,y:.68,hitR:.095,ringR:.055},
  {x:.79,y:.68,hitR:.095,ringR:.055},
  {x:.19,y:.90,hitR:.085,ringR:.050},
  {x:.50,y:.90,hitR:.085,ringR:.050},
  {x:.74,y:.91,hitR:.085,ringR:.050},
  {x:.86,y:.88,hitR:.080,ringR:.045},
];

function sceneSVG(changed=false, enabledSpots=[]) {
  const on = (i) => changed && enabledSpots.includes(i);
  return `
  <svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
    <rect width="800" height="600" fill="#fff7df"/>
    <rect x="35" y="55" width="730" height="490" rx="22" fill="#e5d5b5" stroke="#4c4033" stroke-width="8"/>
    <rect x="55" y="95" width="690" height="8" fill="#6b5a48"/>
    <rect x="55" y="300" width="690" height="8" fill="#6b5a48"/>
    <rect x="55" y="495" width="690" height="8" fill="#6b5a48"/>

    <!-- top packages -->
    <g transform="translate(85 125)">
      <rect width="150" height="145" rx="12" fill="${on(0)?'#ffd34e':'#ff8b2c'}" stroke="#653812" stroke-width="5"/>
      <circle cx="75" cy="62" r="34" fill="#ffe0bd"/>
      <path d="M45 48 Q75 15 105 48" fill="#2c6aa8"/>
      <circle cx="63" cy="63" r="5"/><circle cx="87" cy="63" r="5"/>
      <path d="M60 80 Q75 90 92 79" fill="none" stroke="#222" stroke-width="4"/>
      <text x="75" y="120" text-anchor="middle" font-size="23" font-weight="700">NOODLE</text>
    </g>
    <g transform="translate(325 125)">
      <rect width="150" height="145" rx="12" fill="#ff8b2c" stroke="#653812" stroke-width="5"/>
      <circle cx="75" cy="62" r="34" fill="#ffe0bd"/>
      <path d="M45 48 Q75 15 105 48" fill="${on(1)?'#e63946':'#2c6aa8'}"/>
      <circle cx="63" cy="63" r="5"/><circle cx="87" cy="63" r="5"/>
      <path d="M60 80 Q75 90 92 79" fill="none" stroke="#222" stroke-width="4"/>
      <text x="75" y="120" text-anchor="middle" font-size="23" font-weight="700">NOODLE</text>
    </g>
    <g transform="translate(565 125)">
      <rect width="150" height="145" rx="12" fill="${on(2)?'#86d36b':'#ff8b2c'}" stroke="#653812" stroke-width="5"/>
      <text x="75" y="58" text-anchor="middle" font-size="26" font-weight="800">${on(2)?'3 PACKS':'4 PACKS'}</text>
      <text x="75" y="105" text-anchor="middle" font-size="22" font-weight="700">RAMEN</text>
    </g>

    <!-- middle cups -->
    <g transform="translate(95 345)">
      <path d="M0 0 H130 L115 130 H15 Z" fill="${on(3)?'#8bd17c':'#f6c74a'}" stroke="#5a4627" stroke-width="5"/>
      <text x="65" y="55" text-anchor="middle" font-size="28" font-weight="900">CURRY</text>
    </g>
    <g transform="translate(330 345)">
      <path d="M0 0 H130 L115 130 H15 Z" fill="#f05a49" stroke="#5a4627" stroke-width="5"/>
      <text x="65" y="55" text-anchor="middle" font-size="25" font-weight="900">${on(4)?'SPICY':'ORIGINAL'}</text>
    </g>
    <g transform="translate(570 345)">
      <path d="M0 0 H130 L115 130 H15 Z" fill="${on(5)?'#8e63d6':'#4c91d8'}" stroke="#5a4627" stroke-width="5"/>
      <text x="65" y="50" text-anchor="middle" font-size="23" font-weight="900">SEAFOOD</text>
    </g>

    <!-- bottom boxes -->
    <g transform="translate(80 515)">
      <rect width="150" height="55" rx="8" fill="#ffb4c5" stroke="#6d3847" stroke-width="4"/>
      <text x="75" y="35" text-anchor="middle" font-size="20" font-weight="800">${on(6)?'HOT':'BULDAK'}</text>
    </g>
    <g transform="translate(325 515)">
      <rect width="150" height="55" rx="8" fill="${on(7)?'#ffd56b':'#ffb4c5'}" stroke="#6d3847" stroke-width="4"/>
      <text x="75" y="35" text-anchor="middle" font-size="20" font-weight="800">CARBONARA</text>
    </g>

    <rect x="530" y="515" width="125" height="55" rx="8" fill="#ffd64d" stroke="#6e5310" stroke-width="4"/>
    <text x="592" y="550" text-anchor="middle" font-size="25" font-weight="900">${on(8)?'$5.99':'$6.99'}</text>

    <g transform="translate(690 525)">
      <circle cx="0" cy="0" r="22" fill="${on(9)?'#4c91d8':'#ef476f'}"/>
      <path d="M-8 0 L-1 8 L12 -10" fill="none" stroke="white" stroke-width="6"/>
    </g>
  </svg>`;
}

function buildScene() {
  const count = Number(countSelect.value);
  activeSpots = Array.from({length: count}, (_, i) => i);
  found.clear();
  gameActive = true;
  clearMessage.style.display = "none";
  leftPicture.innerHTML = sceneSVG(false, activeSpots);
  rightPicture.innerHTML = sceneSVG(true, activeSpots);
  hintBtn.disabled = false;
  resetBtn.disabled = false;
  message.textContent = "間違いをタップしてね";
  updateProgress();
}

function updateProgress() {
  progress.textContent = `見つけた数：${found.size} / ${activeSpots.length}`;
  if (gameActive && found.size === activeSpots.length) {
    gameActive = false;
    message.textContent = "クリア！";
    hintBtn.disabled = true;
    clearMessage.style.display = "block";
  }
}

function detectionRadius(spot) {
  const d = difficulty.value;
  const multiplier = d === "easy" ? 1.45 : d === "hard" ? .82 : 1.08;
  return spot.hitR * multiplier;
}

function tapPicture(event, element) {
  if (!gameActive) return;
  const rect = element.getBoundingClientRect();
  const x = (event.clientX - rect.left) / rect.width;
  const y = (event.clientY - rect.top) / rect.height;

  let best = null;
  let bestDist = Infinity;
  for (const idx of activeSpots) {
    if (found.has(idx)) continue;
    const s = allSpots[idx];
    const dist = Math.hypot(x - s.x, y - s.y);
    if (dist <= detectionRadius(s) && dist < bestDist) {
      best = idx; bestDist = dist;
    }
  }

  if (best !== null) {
    found.add(best);
    addRing(leftPicture, allSpots[best], "hit-ring");
    addRing(rightPicture, allSpots[best], "hit-ring");
    message.textContent = "⭕ 正解！";
    updateProgress();
  } else {
    message.textContent = "❌ そこではないみたい";
    const miss = document.createElement("div");
    miss.className = "miss-mark";
    miss.textContent = "×";
    miss.style.left = `${x * 100}%`;
    miss.style.top = `${y * 100}%`;
    element.appendChild(miss);
    setTimeout(() => miss.remove(), 600);
  }
}

function addRing(container, spot, cls) {
  const ring = document.createElement("div");
  ring.className = cls;
  ring.style.left = `${spot.x * 100}%`;
  ring.style.top = `${spot.y * 100}%`;
  ring.style.width = `${spot.ringR * 200}%`;
  ring.style.aspectRatio = "1 / 1";
  container.appendChild(ring);
  if (cls === "hint-ring") setTimeout(() => ring.remove(), 2100);
}

leftPicture.addEventListener("click", e => tapPicture(e, leftPicture));
rightPicture.addEventListener("click", e => tapPicture(e, rightPicture));

startBtn.addEventListener("click", buildScene);
resetBtn.addEventListener("click", buildScene);

hintBtn.addEventListener("click", () => {
  const remain = activeSpots.filter(i => !found.has(i));
  if (!remain.length) return;
  const idx = remain[Math.floor(Math.random() * remain.length)];
  addRing(rightPicture, allSpots[idx], "hint-ring");
  message.textContent = "黄色い丸の近くを見てみよう";
});

photoInput.addEventListener("change", () => {
  const file = photoInput.files?.[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  photoPreview.src = url;
  photoPreview.style.display = "block";
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {
    try {
      const reg = await navigator.serviceWorker.register("./sw.js?v=3");
      await reg.update();

      if (reg.waiting) reg.waiting.postMessage({type: "SKIP_WAITING"});

      reg.addEventListener("updatefound", () => {
        const newWorker = reg.installing;
        if (!newWorker) return;
        newWorker.addEventListener("statechange", () => {
          if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
            newWorker.postMessage({type: "SKIP_WAITING"});
          }
        });
      });

      let refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshing) return;
        refreshing = true;
        location.reload();
      });
    } catch (e) {
      console.log("Service Worker registration skipped:", e);
    }
  });
}

// 初期表示
leftPicture.innerHTML = sceneSVG(false, []);
rightPicture.innerHTML = sceneSVG(true, [0,1,2,3,4]);
</script>
</body>
</html>
